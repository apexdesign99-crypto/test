[project]
name = "ai-land-design"
version = "0.1.0"
description = "土地診断から建築可能判定・間取り・事業費・BIM(IFC)までを算出するパイプライン"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
ai-land-design = "ai_land_design.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.setuptools.packages.find]
include = ["ai_land_design*", "webapp*"]
