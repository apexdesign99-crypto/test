[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee"
version = "0.1.0"
description = "職務定義書 1 枚で立ち上がる、記憶を持つ AI社員"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-employee = "ai_employee.cli:main"

[tool.setuptools.packages.find]
include = ["ai_employee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
